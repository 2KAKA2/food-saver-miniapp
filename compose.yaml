services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      APP_NAME: 食尽其用 API
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY}
      ZHIPU_CHAT_MODEL: glm-4.7-flash
      ZHIPU_VISION_MODEL: glm-4.6v-flash
      SESSION_TTL_DAYS: 30
      LEGAL_VERSION: ${LEGAL_VERSION}
      ALLOW_DEV_LOGIN: "false"
      SEED_DEMO_DATA: "false"
      ALLOWED_ORIGINS: https://${API_DOMAIN}
      ALLOWED_HOSTS: ${API_DOMAIN},api,localhost,127.0.0.1
      TZ: Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ["8000"]
    networks: [backend]

  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks: [backend]

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  backend:

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  redis_data:
